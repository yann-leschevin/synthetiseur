<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetiseur</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">Synthetiseur</h1>
        <p class="app-subtitle">Oscilloscope stereo temps reel</p>
    </header>

    <main class="app-main">
        <section class="control-bar">
            <label class="control source-control" for="source-select">
                <span class="control-label">Source d'entree</span>
                <select id="source-select" class="source-select">
                    <option value="micro">Micro</option>
                    <option value="other">Autre application...</option>
                    <option value="chrome">Chrome (onglet)</option>
                </select>
            </label>

            <button id="mic-btn" class="mic-btn" type="button" aria-pressed="false">
                <span class="mic-dot" aria-hidden="true"></span>
                <span id="mic-btn-label">Activer la source</span>
            </button>

            <div class="control control-listen">
                <span class="control-label">Écoute</span>
                <div class="listen-row">
                    <button id="listen-btn" class="listen-btn" type="button" aria-pressed="false" disabled>
                        <span id="listen-dot" class="listen-dot" aria-hidden="true"></span>
                        <span id="listen-btn-text">ÉCOUTE</span>
                    </button>
                    <output id="listen-state" class="listen-state" for="listen-btn">ÉCOUTE : OFF</output>
                </div>
                <input id="listen-slider" class="range" type="range" min="0" max="100" value="100">
                <output id="listen-value" class="control-value" for="listen-slider">100</output>
            </div>

            <label class="control" for="zoom-slider">
                <span class="control-label">Grossissement</span>
                <input id="zoom-slider" class="range" type="range" min="0" max="400" value="100">
                <output id="zoom-value" class="control-value" for="zoom-slider">100</output>
            </label>

            <label class="control" for="size-slider">
                <span class="control-label">Taille image</span>
                <input id="size-slider" class="range" type="range" min="40" max="100" value="100">
                <output id="size-value" class="control-value" for="size-slider">100</output>
            </label>
        </section>

        <div id="listen-warning" class="listen-warning" hidden></div>

        <section class="scope-wrap">
            <div class="scope-grid">
                <div class="scope-item">
                    <canvas id="scope-left" class="scope"></canvas>
                    <span id="channel-left" class="channel-label channel-left">Gauche</span>
                </div>
                <div class="scope-item">
                    <canvas id="scope-right" class="scope"></canvas>
                    <span id="channel-right" class="channel-label channel-right">Droite</span>
                </div>
            </div>
            <span id="scope-mode" class="scope-mode" hidden>Stéréo</span>
            <div id="scope-status" class="scope-status">En attente de la source...</div>
        </section>
    </main>

    <script>
        const canvasL = document.getElementById('scope-left');
        const canvasR = document.getElementById('scope-right');
        const canvasWrap = document.querySelector('.scope-grid');
        const ctxL = canvasL.getContext('2d');
        const ctxR = canvasR.getContext('2d');
        const micBtn = document.getElementById('mic-btn');
        const micBtnLabel = document.getElementById('mic-btn-label');
        const listenSlider = document.getElementById('listen-slider');
        const listenValue = document.getElementById('listen-value');
        const listenBtn = document.getElementById('listen-btn');
        const listenState = document.getElementById('listen-state');
        const listenWarning = document.getElementById('listen-warning');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomValue = document.getElementById('zoom-value');
        const sizeSlider = document.getElementById('size-slider');
        const sizeValue = document.getElementById('size-value');
        const sourceSelect = document.getElementById('source-select');
        const scopeStatus = document.getElementById('scope-status');
        const leftLabel = document.getElementById('channel-left');
        const rightLabel = document.getElementById('channel-right');
        const scopeMode = document.getElementById('scope-mode');

        const sourceLabels = {
            micro: 'Micro reconnu',
            other: 'Application detectee',
            chrome: 'Chrome connecte'
        };

        let audioCtx = null;
        let listenGain = null;
        let listenAllowed = false;
        let analyserL = null;
        let analyserR = null;
        let source = null;
        let splitter = null;
        let stream = null;
        let dataL = null;
        let dataR = null;
        let running = false;
        let sourceType = 'micro';
        let animationFrameId = null;
        let captureSeq = 0;
        let forcedMono = false;
        let currentMode = 'stereo';
        const modeWindow = 45;
        let modeHistory = [];

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            [canvasL, canvasR].forEach((canvas) => {
                const pw = Math.max(1, Math.round(canvas.clientWidth * dpr));
                const ph = Math.max(1, Math.round(canvas.clientHeight * dpr));
                if (pw !== canvas.width || ph !== canvas.height) {
                    canvas.width = pw;
                    canvas.height = ph;
                }
            });
            ctxL.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxR.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        sizeSlider.addEventListener('input', () => {
            const size = parseInt(sizeSlider.value, 10);
            sizeValue.textContent = size;
            canvasWrap.style.width = size + '%';
            requestAnimationFrame(resizeCanvas);
        });

        canvasWrap.addEventListener('transitionend', resizeCanvas);

        listenSlider.addEventListener('input', () => {
            listenValue.textContent = listenSlider.value;
            updateListenGain();
        });

        zoomSlider.addEventListener('input', () => {
            zoomValue.textContent = zoomSlider.value;
        });

        listenBtn.addEventListener('click', () => {
            if (!running) return;
            listenAllowed = !listenAllowed;
            updateListen();
        });

        sourceSelect.addEventListener('change', async () => {
            sourceType = sourceSelect.value;
            if (running) {
                await startCapture();
            }
        });

        micBtn.addEventListener('click', () => {
            if (running) {
                stopCapture();
            } else {
                startCapture();
            }
        });

        function getAnnouncedChannelCount() {
            try {
                const tracks = stream && stream.getAudioTracks ? stream.getAudioTracks() : [];
                if (tracks.length) {
                    const settings = tracks[0].getSettings();
                    const count = settings && settings.channelCount;
                    if (typeof count === 'number' && count >= 1) return count;
                }
            } catch (e) { }
            return null;
        }

        async function startCapture() {
            const seq = ++captureSeq;
            try {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                stopTracks();

                let mediaStream;
                if (sourceType === 'micro') {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                    });
                } else {
                    const displaySurface = sourceType === 'other' ? 'window' : 'browser';
                    mediaStream = await navigator.mediaDevices.getDisplayMedia({
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                        video: { displaySurface }
                    });
                    mediaStream.getVideoTracks().forEach(t => t.stop());
                }

                if (seq !== captureSeq) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    return;
                }

                stream = mediaStream;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                source = audioCtx.createMediaStreamSource(stream);

                analyserL = audioCtx.createAnalyser();
                analyserR = audioCtx.createAnalyser();
                analyserL.fftSize = 2048;
                analyserR.fftSize = 2048;
                dataL = new Uint8Array(analyserL.frequencyBinCount);
                dataR = new Uint8Array(analyserR.frequencyBinCount);

                splitter = audioCtx.createChannelSplitter(2);
                listenGain = audioCtx.createGain();
                listenGain.connect(audioCtx.destination);
                source.connect(splitter);
                source.connect(listenGain);
                splitter.connect(analyserL, 0);
                splitter.connect(analyserR, 1);

                running = true;
                forcedMono = getAnnouncedChannelCount() === 1;
                modeHistory.length = 0;
                currentMode = forcedMono ? 'mono' : 'stereo';
                updateModeUI();
                listenAllowed = sourceType !== 'micro';
                updateListen();
                setMicState(true, sourceLabels[sourceType]);
                if (audioCtx.state === 'suspended') audioCtx.resume();
                animationFrameId = requestAnimationFrame(draw);
            } catch (err) {
                if (seq !== captureSeq) return;
                running = false;
                stopTracks();
                updateModeUI();
                updateListenUI();
                listenWarning.hidden = true;
                setMicState(false, 'Erreur: ' + (err.name || err.message));
            }
        }

        function stopTracks() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            if (source) { source.disconnect(); source = null; }
            if (splitter) { splitter.disconnect(); splitter = null; }
            if (listenGain) { listenGain.disconnect(); listenGain = null; }
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            analyserL = null;
            analyserR = null;
            dataL = null;
            dataR = null;
        }

        function stopCapture() {
            running = false;
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            stopTracks();
            [canvasL, canvasR].forEach((canvas) => {
                const c = canvas.getContext('2d');
                c.clearRect(0, 0, canvas.width, canvas.height);
            });
            currentMode = 'stereo';
            updateModeUI();
            updateListenUI();
            listenWarning.hidden = true;
            setMicState(false, 'Source arretee');
        }

        function updateListenGain() {
            if (!listenGain) return;
            listenGain.gain.value = listenAllowed
                ? parseInt(listenSlider.value, 10) / 100
                : 0;
        }

        function updateListenWarning() {
            if (!running) {
                listenWarning.hidden = true;
                return;
            }
            if (sourceType === 'micro') {
                listenWarning.hidden = false;
                listenWarning.classList.remove('warn', 'warn-active');
                if (listenAllowed) {
                    listenWarning.classList.add('warn-active');
                    listenWarning.textContent = 'Ecoute du micro activee : portez un casque pour eviter le larsen (boucle acoustique).';
                } else {
                    listenWarning.classList.add('warn');
                    listenWarning.textContent = 'Ecoute du micro desactivee par defaut pour eviter le larsen. Activez l\'ecoute volontairement en cochant la case, en utilisant un casque.';
                }
            } else {
                listenWarning.hidden = true;
            }
        }

        function updateListen() {
            updateListenGain();
            updateListenWarning();
            updateListenUI();
        }

        function updateListenUI() {
            const active = running && listenAllowed;
            listenBtn.classList.toggle('active', active);
            listenBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
            listenBtn.disabled = !running;
            if (active) {
                listenState.textContent = sourceType === 'micro'
                    ? 'ÉCOUTE : ON · ⚠️ Casque recommandé'
                    : 'ÉCOUTE : ON';
            } else {
                listenState.textContent = 'ÉCOUTE : OFF';
            }
            listenState.classList.toggle('on', active);
            listenState.classList.toggle('warn', active && sourceType === 'micro');
        }

        function setMicState(active, label) {
            micBtn.classList.toggle('active', active);
            micBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
            micBtnLabel.textContent = label;
            scopeStatus.classList.toggle('hidden', active);
            scopeStatus.textContent = active
                ? 'Ecoute de ' + sourceSelect.options[sourceSelect.selectedIndex].text.toLowerCase()
                : 'En attente de la source...';
        }

        function updateModeUI() {
            if (!running) {
                scopeMode.hidden = true;
                leftLabel.textContent = 'Gauche';
                rightLabel.textContent = 'Droite';
                return;
            }
            const mono = currentMode === 'mono';
            scopeMode.hidden = false;
            scopeMode.textContent = mono ? 'Mono' : 'Stéréo';
            scopeMode.classList.toggle('mono', mono);
            leftLabel.textContent = mono ? 'Gauche (mono)' : 'Gauche';
            rightLabel.textContent = mono ? 'Droite (mono)' : 'Droite';
        }

        function drawChannel(canvas, c, dataArray, gain, c1, c2) {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            c.clearRect(0, 0, w, h);

            const mid = h / 2;

            c.lineWidth = 1;
            c.strokeStyle = 'rgba(255,255,255,0.08)';
            c.beginPath();
            c.moveTo(0, mid);
            c.lineTo(w, mid);
            c.stroke();
            c.beginPath();
            c.moveTo(w / 2, 0);
            c.lineTo(w / 2, h);
            c.stroke();

            const grad = c.createLinearGradient(0, 0, w, 0);
            grad.addColorStop(0, c1);
            grad.addColorStop(1, c2);
            c.strokeStyle = grad;
            c.lineWidth = Math.max(1.5, h * 0.004);
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.shadowColor = 'rgba(124,77,255,0.35)';
            c.shadowBlur = 6;

            c.beginPath();
            const slice = w / dataArray.length;
            for (let i = 0; i < dataArray.length; i++) {
                const v = (dataArray[i] / 128.0 - 1.0) * gain;
                const y = mid + v * (h * 0.96);
                const x = i * slice;
                if (i === 0) c.moveTo(x, y);
                else c.lineTo(x, y);
            }
            c.stroke();
            c.shadowBlur = 0;
        }

        function computeLevel(dataArray) {
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const v = dataArray[i] / 128 - 1;
                sum += v * v;
            }
            return Math.sqrt(sum / dataArray.length);
        }

        function channelCorrelation(a, b) {
            let ma = 0;
            let mb = 0;
            for (let i = 0; i < a.length; i++) { ma += a[i]; mb += b[i]; }
            ma /= a.length;
            mb /= b.length;
            let num = 0;
            let da = 0;
            let db = 0;
            for (let i = 0; i < a.length; i++) {
                const x = a[i] - ma;
                const y = b[i] - mb;
                num += x * y;
                da += x * x;
                db += y * y;
            }
            return (da === 0 || db === 0) ? 1 : num / Math.sqrt(da * db);
        }

        const MIN_SIGNAL_LEVEL = 0.04;
        const DUP_CORRELATION = 0.985;

        function detectMode(levelL, levelR) {
            const lActive = levelL > MIN_SIGNAL_LEVEL;
            const rActive = levelR > MIN_SIGNAL_LEVEL;
            if (lActive && !rActive) return 'mono';
            if (lActive && rActive && channelCorrelation(dataL, dataR) > DUP_CORRELATION) return 'mono';
            return null;
        }

        function draw() {
            if (!running || !analyserL || !analyserR) return;
            animationFrameId = requestAnimationFrame(draw);

            resizeCanvas();

            analyserL.getByteTimeDomainData(dataL);
            analyserR.getByteTimeDomainData(dataR);

            if (!forcedMono) {
                const levelL = computeLevel(dataL);
                const levelR = computeLevel(dataR);
                const frameMode = detectMode(levelL, levelR);
                if (frameMode) {
                    modeHistory.push(frameMode);
                    if (modeHistory.length > modeWindow) modeHistory.shift();
                    let monoCount = 0;
                    for (const m of modeHistory) if (m === 'mono') monoCount++;
                    const nextMode = monoCount > modeHistory.length / 2 ? 'mono' : 'stereo';
                    if (nextMode !== currentMode) {
                        currentMode = nextMode;
                        updateModeUI();
                    }
                }
            }

            const gain = parseInt(zoomSlider.value, 10) / 100;
            drawChannel(canvasL, ctxL, dataL, gain, '#00e5ff', '#7c4dff');
            if (currentMode === 'mono') {
                drawChannel(canvasR, ctxR, dataL, gain, '#7c4dff', '#ff2d95');
            } else {
                drawChannel(canvasR, ctxR, dataR, gain, '#7c4dff', '#ff2d95');
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
